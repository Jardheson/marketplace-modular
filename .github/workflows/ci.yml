name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: marketplace_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-secret
      OTEL_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Lint OpenAPI (Spectral)
        run: npx @stoplight/spectral-cli lint docs/openapi.yaml

      - name: SCA (npm audit)
        run: npm audit --audit-level=high

      - name: Run unit + contract tests with coverage
        run: npm run test:coverage
        env:
          CI: 'true'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration

      - name: Start API for k6 smoke test
        run: |
          npm start > /tmp/marketplace-api.log 2>&1 &
          echo $! > /tmp/marketplace-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/marketplace-api.log
          exit 1

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke test
        run: |
          mkdir -p artifacts
          k6 run --summary-export=artifacts/k6-smoke-summary.json k6/smoke.js
        env:
          BASE_URL: http://localhost:3000

      - name: Upload k6 smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-summary
          path: artifacts/k6-smoke-summary.json
