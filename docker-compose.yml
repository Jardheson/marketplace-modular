services:
  # ============================================================
  # Banco de dados PostgreSQL
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: marketplace-modular-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-marketplace}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-marketplace}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # Redis (cache + fila BullMQ)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: marketplace-modular-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # Aplicação
  # ============================================================
  app:
    build: .
    container_name: marketplace-modular-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-marketplace}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CACHE_TTL_SECONDS: 300
      OTEL_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_LEVEL: info
      FF_NEW_CHECKOUT: 'false'
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - ./docs:/app/docs

  # ============================================================
  # Observabilidade: Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: marketplace-modular-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  # ============================================================
  # Observabilidade: Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:11.4.0
    container_name: marketplace-modular-grafana
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ============================================================
  # Observabilidade: Jaeger (tracing)
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: marketplace-modular-jaeger
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP HTTP collector
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'

volumes:
  pgdata:
  redisdata:
  grafanadata:
